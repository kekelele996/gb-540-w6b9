name: cadastral-boundary-topology-resolution

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ${COMPOSE_PROJECT_NAME:-cadastral-boundary-topology-resolution}-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cadastral_topology}
      POSTGRES_USER: ${POSTGRES_USER:-cadastral_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cadastral_local_password}
    ports:
      - "${DB_PORT:-57540}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/10-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cadastral_app} -d ${POSTGRES_DB:-cadastral_topology}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-cadastral-boundary-topology-resolution}-backend
    environment:
      PORT: "8080"
      DB_DRIVER: postgres
      DB_DSN: host=db user=${POSTGRES_USER:-cadastral_app} password=${POSTGRES_PASSWORD:-cadastral_local_password} dbname=${POSTGRES_DB:-cadastral_topology} port=5432 sslmode=disable TimeZone=Asia/Shanghai
      DB_AUTO_MIGRATE: "true"
      JWT_SECRET: ${JWT_SECRET:-cadastral-compose-secret-at-least-32-bytes}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:18540,http://127.0.0.1:18540}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${BACKEND_PORT:-19540}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-cadastral-boundary-topology-resolution}-frontend
    ports:
      - "${FRONTEND_PORT:-18540}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  db_data:
    name: ${COMPOSE_PROJECT_NAME:-cadastral-boundary-topology-resolution}-db-data
